# Installed by rproxy scripts/setup.sh to /etc/nginx/conf.d/rproxy-json-log.conf.
# Edit the copy in the repo and re-run setup.sh — not this file.
#
# Structured (JSON) access log for log shippers. Every server block rproxy
# generates writes to /var/log/nginx/rproxy-json-access.log in this format
# (see JSON_ACCESS_LOG in config-generator/nginx-config.ts); the http-level
# access_log below covers server blocks with no access_log of their own
# (HTTP→HTTPS redirect servers, redirect hosts).
#
# Never logs query strings: $uri (not $request_uri), and the referer is cut
# at the first '?' or '#'. Query strings carry tokens and session ids.

map $http_referer $rproxy_referer {
    default          "";
    "~^([^?#]*)"     $1;
}

log_format rproxy_json escape=json
    '{"msec":$msec,'
    '"host":"$host",'
    '"method":"$request_method",'
    '"uri":"$uri",'
    '"status":$status,'
    '"request_time":$request_time,'
    '"body_bytes_sent":$body_bytes_sent,'
    '"upstream_addr":"$upstream_addr",'
    '"upstream_status":"$upstream_status",'
    '"upstream_response_time":"$upstream_response_time",'
    '"remote_addr":"$remote_addr",'
    '"x_forwarded_for":"$http_x_forwarded_for",'
    '"country":"$http_cf_ipcountry",'
    '"user_agent":"$http_user_agent",'
    '"referer":"$rproxy_referer"}';

access_log /var/log/nginx/rproxy-json-access.log rproxy_json;
